<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  /* Ported 1:1 from the UrlHud toolbar preview (navy/white theme) -
     same colors, spacing, and structure, sized for touch. */
  :root {
    --bar-bg: #000432;
    --bar-border: rgba(255, 255, 255, 0.35);
    --accent: #ffffff;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.65);
    --chip-bg: rgba(255, 255, 255, 0.10);
    --chip-border: rgba(255, 255, 255, 0.35);
    --danger: #ffffff;
  }

  #bottom-bar {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bar-bg);
    border-top: 1px solid var(--bar-border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #bookmark-bar {
    flex: 0 0 42px;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 1px;
    padding: 0 4px;
    box-sizing: border-box;
    overflow: hidden;
    border-bottom: 1px solid var(--bar-border);
  }

  .folder-btn {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 0%;
    flex-shrink: 1;
    min-width: 0;
    max-width: 100%;
    width: 0;
    height: 26px;
    padding: 0;
    margin: 0;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bar-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    font-size: 8px;
    font-weight: 700;
    font-family: "Courier New", monospace;
    line-height: 1;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
    -webkit-user-select: none;
    user-select: none;
  }
  .folder-btn:active { background: #ffffff; border-color: #ffffff; color: var(--bar-bg); }
  .folder-btn.active { background: #ffffff; border-color: #ffffff; color: var(--bar-bg); }
  .folder-btn.has-bookmarks::after {
    content: "";
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid var(--bar-bg);
  }

  #folder-panel {
    position: absolute;
    inset: 0;
    background: var(--bar-bg);
    z-index: 80;
    display: none;
    flex-direction: column;
    box-sizing: border-box;
  }
  #folder-panel.open { display: flex; }

  .fp-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--bar-border); flex: 0 0 auto; }
  .fp-title { font-size: 13px; font-weight: 700; color: #ffffff; }
  .fp-close { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px; }

  .fp-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 6px; }
  .fp-empty { padding: 8px 10px; text-align: center; color: var(--text-dim); font-size: 12px; }

  .fp-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .fp-item:active { background: rgba(255, 255, 255, 0.05); }
  .fp-item-label { flex: 1 1 auto; font-size: 12px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-del { flex: 0 0 auto; background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 2px 6px; }

  .fp-add-row { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid var(--bar-border); flex: 0 0 auto; }
  .fp-add-input {
    flex: 1 1 auto;
    height: 28px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--chip-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 0 8px;
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
  }
  .fp-add-input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.08); }
  .fp-add-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .fp-add-btn:active { background: rgba(74, 144, 226, 0.22); border-color: var(--accent); }

  #quick-bm-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 120;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #quick-bm-overlay.open { display: flex; }
  #quick-bm-modal {
    width: 100%;
    max-width: 380px;
    background: var(--bar-bg);
    border: 1px solid var(--chip-border);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.55);
    padding: 12px;
    box-sizing: border-box;
  }
  .qbm-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .qbm-title { font-size: 14px; font-weight: 700; color: #ffffff; }
  .qbm-close { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px; }
  .qbm-url { font-size: 11px; color: var(--text-dim); word-break: break-all; margin-bottom: 10px; }
  .qbm-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  #qbm-name-input {
    width: 100%;
    height: 32px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--chip-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 0 10px;
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  #qbm-name-input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.08); }
  #qbm-folder-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .qbm-folder-opt {
    height: 26px;
    border-radius: 4px;
    border: 1px solid var(--chip-border);
    background: var(--bar-bg);
    color: var(--text);
    font-size: 10px;
    font-weight: 700;
    font-family: "Courier New", monospace;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qbm-folder-opt.selected { background: #ffffff; border-color: #ffffff; color: var(--bar-bg); }
  .qbm-actions { display: flex; gap: 8px; }
  .qbm-actions button {
    flex: 1 1 0;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #qbm-save-btn { background: #ffffff; color: var(--bar-bg); border-color: #ffffff; }

  #toolbar-row {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 6px;
    flex: 0 0 42px;
    min-height: 0;
    box-sizing: border-box;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #toolbar-row::-webkit-scrollbar { display: none; }

  .icon-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    position: relative;
    -webkit-user-select: none;
    user-select: none;
  }
  .icon-btn:active:not(:disabled) { background: #ffffff; color: var(--bar-bg); border-color: #ffffff; }
  .icon-btn:disabled { opacity: 0.3; }
  .icon-btn.danger:active:not(:disabled) { background: #ffffff; border-color: #ffffff; color: var(--bar-bg); }

  #btn-fullscreen { display: none; }

  #address-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 90px;
  }

  #address-input {
    width: 100%;
    height: 32px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--chip-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 0 32px 0 10px;
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
  }
  #address-input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.08); }

  #btn-add-bookmark {
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    font-size: 13px;
  }

  .divider { width: 1px; height: 20px; background: var(--bar-border); flex: 0 0 auto; margin: 0 1px; }

  #downloads-wrap { position: relative; }

  #downloads-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: #ffffff;
    color: var(--bar-bg);
    font-size: 9px;
    font-weight: 700;
    border-radius: 8px;
    min-width: 14px;
    height: 14px;
    line-height: 14px;
    text-align: center;
    padding: 0 3px;
    display: none;
    pointer-events: none;
  }

  #downloads-panel {
    position: absolute;
    bottom: 100px;
    right: 8px;
    left: 8px;
    max-height: 60%;
    overflow-y: auto;
    background: var(--bar-bg);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    display: none;
    flex-direction: column;
    padding: 6px;
    z-index: 50;
  }
  #downloads-panel.open { display: flex; }

  .dl-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 10px; }
  .dl-header span { font-size: 13px; font-weight: 700; color: #ffffff; }
  .dl-clear { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px; }
  .dl-empty { padding: 24px 10px; text-align: center; color: var(--text-dim); font-size: 13px; }

  .dl-item { padding: 10px; border-radius: 8px; }
  .dl-item:active { background: rgba(255, 255, 255, 0.04); }
  .dl-name { font-size: 13px; color: #ffffff; font-weight: 600; margin-bottom: 3px; word-break: break-all; }
  .dl-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 7px; }
  .dl-progress-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-bottom: 7px; }
  .dl-progress-fill { height: 100%; background: var(--accent); width: 0%; }
  .dl-actions { display: flex; gap: 8px; }
  .dl-actions button {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: #ffffff;
    cursor: pointer;
  }
  .dl-actions button.danger:active { background: #ffffff; border-color: #ffffff; color: var(--bar-bg); }
</style>
</head>
<body>
<div id="bottom-bar">
  <div id="bookmark-bar"></div>

  <div id="toolbar-row">
    <div id="address-wrap">
      <input id="address-input" type="text" placeholder="Enter URL and press Go…" autocomplete="off" spellcheck="false">
      <button class="icon-btn" id="btn-add-bookmark" title="Add bookmark">&#43;</button>
    </div>

    <div class="divider"></div>

    <!-- kept in DOM (hidden via CSS) because verbatim bar.js does
         getElementById('btn-fullscreen').addEventListener(...) with no null-check -->
    <button class="icon-btn" id="btn-fullscreen" title="Enter fullscreen">&#9974;</button>

    <!-- Zoom controls for the focused pane, wired to AndroidAPI.zoomIn()/zoomOut() -> MainActivity's existing applyZoomStep(). -->
    <button class="icon-btn" id="btn-zoom-out" title="Zoom out focused window">&#8722;</button>
    <button class="icon-btn" id="btn-zoom-in" title="Zoom in focused window">&#43;</button>

    <div id="downloads-wrap">
      <button class="icon-btn" id="btn-downloads" title="Downloads">
        &#8595;
        <span id="downloads-badge">0</span>
      </button>
    </div>

    <div class="divider"></div>

    <button class="icon-btn" id="btn-split-row" title="Split side by side">&#8646;</button>
    <button class="icon-btn" id="btn-split-col" title="Split top/bottom">&#8645;</button>
    <button class="icon-btn danger" id="btn-close-pane" title="Remove this split" disabled>&#10005;</button>
  </div>

  <div id="folder-panel">
    <div class="fp-header">
      <span class="fp-title" id="fp-title">Folder</span>
      <button class="fp-close" id="fp-close-btn" title="Close">&#10005;</button>
    </div>
    <div class="fp-list" id="fp-list"></div>
    <div class="fp-add-row">
      <input id="fp-add-input" type="text" placeholder="Label for this page…" autocomplete="off" spellcheck="false">
      <button class="fp-add-btn" id="fp-add-btn" title="Save current page in this folder">&#43;</button>
    </div>
  </div>
</div>

<div id="downloads-panel">
  <div class="dl-header">
    <span>Downloads</span>
    <button class="dl-clear" id="dl-clear-btn">Clear completed</button>
  </div>
  <div id="dl-list"></div>
</div>

<div id="quick-bm-overlay">
  <div id="quick-bm-modal">
    <div class="qbm-header">
      <span class="qbm-title">Add Bookmark</span>
      <button class="qbm-close" id="qbm-close-btn" title="Close">&#10005;</button>
    </div>
    <div class="qbm-url" id="qbm-url-preview"></div>
    <div class="qbm-label">Bookmark name</div>
    <input id="qbm-name-input" type="text" autocomplete="off" spellcheck="false">
    <div class="qbm-label">Folder</div>
    <div id="qbm-folder-grid"></div>
    <div class="qbm-actions">
      <button id="qbm-cancel-btn">Cancel</button>
      <button id="qbm-save-btn">Save</button>
    </div>
  </div>
</div>

  <script src="bar.js"></script>
</body>
</html>
